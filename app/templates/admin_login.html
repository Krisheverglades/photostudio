<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="studio-page">
  {% if background_images %}
  <div class="studio-backdrop" aria-hidden="true">
    {% for img in background_images %}
    <img src="/media/_portfolio/{{ img }}" alt="">
    {% endfor %}
  </div>
  {% endif %}
  <div class="nav">
    <a class="brand" href="/"><span class="brand-mark">/</span>Studio</a>
  </div>
  <div class="panel">
    <div class="eyebrow">Private workspace</div>
    <h1>Welcome back</h1>
    <p class="panel-intro">Sign in to manage shoots, galleries, and your public portfolio.</p>
    {% if error %}
      <div class="notice">{{ error }}</div>
    {% endif %}
    <form method="get" action="/admin">
      <div class="field">
        <label>Password</label>
        <input type="password" name="pw" autofocus>
      </div>
      <button class="btn" type="submit">Enter workspace <span aria-hidden="true">&nbsp;↗</span></button>
    </form>
  </div>
</body>
</html>
